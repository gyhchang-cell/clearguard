[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clearguard-desktop"
version = "0.2.0"
description = "Offline duplicate finder with evidence, explicit consent and native Trash"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Send2Trash==2.2.0", "psutil==7.2.2"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.0"]

[project.gui-scripts]
clearguard = "clearguard.app:main"

[tool.setuptools.packages.find]
include = ["clearguard*"]
