name: Development checks (no publishing)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[build]"
      - run: python -m unittest discover -s tests -v
      - run: python tests/gui_smoke.py
      - run: python build.py
      - run: python verify_build_isolation.py
      - run: python package.py
      - run: python verify_bundle.py
